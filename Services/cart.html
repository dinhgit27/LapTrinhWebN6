<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - LocalBrand</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <header class="header">
        <div class="container header-inner">
            <a href="index.html" class="logo"><img src="images/logo.jpg" alt="Logo"></a>
            <div class="header-title">GIỎ HÀNG CỦA BẠN</div>
            <a href="products.html" class="back-link"><i class="ri-arrow-left-s-line"></i> Tiếp tục mua sắm</a>
        </div>
    </header>

    <div class="container cart-page">
        <div id="cart-content" class="cart-container">
            <div class="cart-list" id="cartItems">
                </div>

            <aside class="cart-summary">
                <h3>TÓM TẮT ĐƠN HÀNG</h3>
                <div class="summary-row">
                    <span>Tạm tính:</span>
                    <span id="subtotal">0đ</span>
                </div>
                <div class="summary-row">
                    <span>Phí vận chuyển:</span>
                    <span style="color: #22c55e; font-weight: 600;">Miễn phí</span>
                </div>
                <div class="summary-total">
                    <span>Tổng cộng:</span>
                    <span id="total-price" style="color: var(--accent-color);">0đ</span>
                </div>
                <button class="btn-checkout" id="btnCheckout">TIẾN HÀNH THANH TOÁN</button>
            </aside>
        </div>

        <div id="empty-msg" class="empty-cart">
            <i class="ri-shopping-cart-line"></i>
            <h2>Giỏ hàng của bạn đang trống</h2>
            <p style="color: #64748B; margin-bottom: 30px;">Hãy quay lại cửa hàng để chọn cho mình những món đồ ưng ý nhất nhé!</p>
            <a href="products.html" class="btn-checkout" style="display: inline-block; width: auto; padding: 15px 40px;">MUA SẮM NGAY</a>
        </div>
    </div>

    <script>
        // 1. Hàm hiển thị danh sách sản phẩm trong giỏ
        function renderCart() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const container = document.getElementById('cartItems');
            const content = document.getElementById('cart-content');
            const emptyMsg = document.getElementById('empty-msg');

            if (cart.length === 0) {
                content.style.display = 'none';
                emptyMsg.style.display = 'block';
                return;
            }

            content.style.display = 'grid';
            emptyMsg.style.display = 'none';
            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                container.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.thumbnail}" onerror="this.src='https://via.placeholder.com/100x130'">
                        <div class="item-info">
                            <h3>${item.name}</h3>
                            <p>Bộ sưu tập: Streetwear 2026</p>
                            <div class="item-price">${item.price.toLocaleString('vi-VN')}đ</div>
                        </div>
                        <div class="quantity-control">
                            <button onclick="changeQty(${item.id}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty(${item.id}, 1)">+</button>
                        </div>
                        <i class="ri-delete-bin-line btn-remove" onclick="removeItem(${item.id})"></i>
                    </div>
                `;
            });

            document.getElementById('subtotal').innerText = total.toLocaleString('vi-VN') + 'đ';
            document.getElementById('total-price').innerText = total.toLocaleString('vi-VN') + 'đ';
        }

        // 2. Tăng/Giảm số lượng
        function changeQty(id, delta) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            const index = cart.findIndex(item => item.id === id);
            if (index > -1) {
                cart[index].quantity += delta;
                if (cart[index].quantity < 1) cart[index].quantity = 1;
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        // 3. Xóa sản phẩm
        function removeItem(id) {
            if(confirm('Bạn muốn xóa sản phẩm này khỏi giỏ hàng?')) {
                let cart = JSON.parse(localStorage.getItem('cart'));
                cart = cart.filter(item => item.id !== id);
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        // 4. CHẶN THANH TOÁN NẾU CHƯA ĐĂNG NHẬP
        document.getElementById('btnCheckout').addEventListener('click', () => {
            const token = localStorage.getItem('token'); // Lấy mã JWT từ trang Login
            
            if (!token) {
                alert('Vui lòng đăng nhập để tiến hành đặt hàng!');
                localStorage.setItem('redirectAfterLogin', 'cart.html'); // Ghi nhớ để quay lại đây sau khi login
                window.location.href = 'login.html';
            } else {
                window.location.href = 'checkout.html'; // Trang thanh toán (bạn sẽ làm sau)
            }
        });

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
