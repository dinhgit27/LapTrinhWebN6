<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Mặc Đúng Chất Mình</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <style>
        /* --- DÙNG CHUNG BIẾN VÀ RESET VỚI TRANG ĐĂNG NHẬP --- */
        :root {
            --primary-color: #0F172A; 
            --accent-color: #0D9488; 
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); color: var(--primary-color); height: 100vh; overflow: hidden; background: #fff; }
        a { text-decoration: none; color: inherit; }

        .login-layout { display: flex; height: 100vh; width: 100%; }

        /* --- PHẦN BÊN TRÁI (HÌNH ẢNH KHÁC TRANG LOGIN ĐỂ TẠO SỰ MỚI MẺ) --- */
        .login-left {
            flex: 1; 
            position: relative;
            /* Đổi sang một bức ảnh mang tính chất "Shopping / New Member" hơn */
            background: linear-gradient(to top, rgba(13, 148, 136, 0.95) 0%, rgba(0,0,0,0.1) 50%), url('https://images.unsplash.com/photo-1483985988355-763728e1935b?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 60px; color: white;
        }

        .glass-badge {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px 20px;
            border-radius: 16px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .glass-badge:hover {
            background: rgba(13, 148, 136, 0.3);
            border-color: var(--accent-color);
            transform: perspective(1000px) rotateX(10deg) rotateY(10deg) translateY(-15px) scale(1.05);
            box-shadow: 0 0 20px var(--accent-color), 0 0 40px rgba(13, 148, 136, 0.2);
        }

        
        .badge-1 { top: 40px; left: 40px; padding: 8px 20px; border-radius: 30px; font-weight: bold; font-size: 0.8rem; }
        .badge-2 { top: 35%; right: 40px; } /* Đảo vị trí một chút cho lạ mắt */
        
        .glass-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--accent-color); display: flex; justify-content: center; align-items: center; font-size: 1.2rem; }

        .left-text-content h1 { font-family: var(--font-heading); font-size: 3.5rem; line-height: 1.1; margin: 10px 0; }
        .left-text-content p { opacity: 0.9; font-size: 1.1rem; }
        .left-text-content .sub { letter-spacing: 2px; font-weight: 600; font-size: 0.9rem; }

        /* --- PHẦN BÊN PHẢI (FORM ĐĂNG KÝ) --- */
        .login-right { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow-y: auto; } /* Thêm overflow-y phòng khi màn hình nhỏ */

        .back-home { position: absolute; top: 40px; right: 40px; font-weight: 500; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; color: #64748B; transition: 0.3s; }
        .back-home:hover { color: var(--accent-color); }

        .form-wrapper { width: 100%; max-width: 420px; padding: 40px 0; }
        
        .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-heading); font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; }
        .brand i { color: white; background: var(--accent-color); padding: 5px; border-radius: 8px; font-size: 1.2rem; }

        .form-wrapper h2 { font-size: 2rem; font-family: var(--font-heading); margin-bottom: 5px; }
        .form-wrapper > p { color: #64748B; margin-bottom: 25px; }

        .social-login { display: flex; gap: 15px; margin-bottom: 25px; }
        .social-btn { flex: 1; padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px; background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 600; color: var(--primary-color); font-family: var(--font-body); transition: 0.3s; }
        .social-btn:hover { background: #F8FAFC; border-color: #CBD5E1; }
        .social-btn i { font-size: 1.2rem; color: #1877F2; }

        .divider { display: flex; align-items: center; text-align: center; margin-bottom: 25px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #E2E8F0; }
        .divider span { padding: 0 15px; color: #94A3B8; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; }

        /* NHẬP THÔNG TIN (Gọn gàng hơn) */
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85rem; }
        .input-box { position: relative; }
        .input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #94A3B8; font-size: 1.2rem; }
        .input-box input { width: 100%; padding: 12px 15px 12px 45px; border: 1px solid #E2E8F0; border-radius: 12px; outline: none; font-family: var(--font-body); font-size: 0.95rem; transition: 0.3s; }
        .input-box input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1); }
        .input-box .eye-icon { left: auto; right: 15px; cursor: pointer; }

        .form-actions { display: flex; margin-bottom: 25px; font-size: 0.85rem; }
        .form-actions label { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; color: #64748B; line-height: 1.4; }
        .form-actions a { color: var(--accent-color); font-weight: 600; }

        .submit-btn { width: 100%; padding: 16px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; transition: 0.3s; }
        .submit-btn:hover { background: #1E293B; transform: translateY(-2px); }

        .login-link { text-align: center; margin-top: 25px; font-size: 0.9rem; color: #64748B; }
        .login-link a { color: var(--accent-color); font-weight: 600; margin-left: 5px; }
        .login-link a:hover { text-decoration: underline; }

        /* Điều chỉnh khung chứa logo và chữ */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* GIẢM KÍCH CỠ LOGO TẠI ĐÂY */
        .brand img {
            height: 35px; /* Bạn có thể chỉnh xuống 30px nếu muốn nhỏ hơn nữa */
            width: auto;
            object-fit: contain;
            border-radius: 6px; /* Bo góc nhẹ để logo trông mềm mại hơn */
        }
    </style>
</head>
<body>

    <div class="login-layout">
        
        <div class="login-left">
            <div class="glass-badge badge-1">● THÀNH VIÊN MỚI</div>
            
            <div class="glass-badge badge-2">
                <div class="glass-icon"><i class="ri-vip-crown-fill"></i></div>
                <div>
                    <div style="font-size: 0.75rem; font-weight: bold; opacity: 0.8;">QUYỀN LỢI</div>
                    <div style="font-size: 1.1rem; font-weight: 800;">Giảm 10% đơn đầu</div>
                </div>
            </div>

            <div class="left-text-content">
                <span class="sub">THAM GIA CỘNG ĐỒNG</span>
                <h1>Tự tin <br>thể hiện cá tính</h1>
                <p>Khởi đầu hành trình định hình phong cách cùng LocalBrand ngay hôm nay.</p>
            </div>
        </div>

        <div class="login-right">
            <a href="index.html" class="back-home"><i class="ri-home-4-line"></i> Trang chủ</a>

            <div class="form-wrapper">
                <div class="brand">
                    <img src="images/logo.jpg" alt="Logo"> LocalBrand
                </div>
                
                <h2>Tạo tài khoản ✨</h2>
                <p>Nhanh chóng, dễ dàng và hoàn toàn miễn phí</p>

                <div class="social-login">
                    <button class="social-btn">
                        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20" alt="Google"> Google
                    </button>
                    <button class="social-btn">
                        <i class="ri-facebook-circle-fill"></i> Facebook
                    </button>
                </div>

                <div class="divider">
                    <span>HOẶC ĐĂNG KÝ VỚI EMAIL</span>
                </div>

                <form action="login.html">
                    <div class="input-group">
                        <label>Họ và Tên</label>
                        <div class="input-box">
                            <i class="ri-user-line"></i>
                            <input type="text" placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-box">
                            <i class="ri-mail-line"></i>
                            <input type="email" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <div class="input-box">
                            <i class="ri-lock-line"></i>
                            <input type="password" placeholder="Tối thiểu 8 ký tự" required>
                            <i class="ri-eye-off-line eye-icon"></i>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label>
                            <input type="checkbox" required style="margin-top: 3px;"> 
                            <span>Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a> của LocalBrand.</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        Đăng Ký Ngay <i class="ri-user-add-line"></i>
                    </button>
                </form>

                <div class="login-link">
                    Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
