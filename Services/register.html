<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Mặc Đúng Chất Mình</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="login-layout">
        
        <div class="login-left">
            <div class="glass-badge badge-1">● THÀNH VIÊN MỚI</div>
            
            <div class="glass-badge badge-2">
                <div class="glass-icon"><i class="ri-vip-crown-fill"></i></div>
                <div>
                    <div style="font-size: 0.75rem; font-weight: bold; opacity: 0.8;">QUYỀN LỢI</div>
                    <div style="font-size: 1.1rem; font-weight: 800;">Giảm 10% đơn đầu</div>
                </div>
            </div>

            <div class="left-text-content">
                <span class="sub">THAM GIA CỘNG ĐỒNG</span>
                <h1>Tự tin <br>thể hiện cá tính</h1>
                <p>Khởi đầu hành trình định hình phong cách cùng LocalBrand ngay hôm nay.</p>
            </div>
        </div>

        <div class="login-right">
            <a href="index.html" class="back-home"><i class="ri-home-4-line"></i> Trang chủ</a>

            <div class="form-wrapper">
                <div class="brand">
                    <img src="images/logo.jpg" alt="Logo"> LocalBrand
                </div>
                
                <h2>Tạo tài khoản ✨</h2>
                <p>Nhanh chóng, dễ dàng và hoàn toàn miễn phí</p>

                <div class="social-login">
                    <button class="social-btn">
                        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20" alt="Google"> Google
                    </button>
                    <button class="social-btn">
                        <i class="ri-facebook-circle-fill"></i> Facebook
                    </button>
                </div>

                <div class="divider">
                    <span>HOẶC ĐĂNG KÝ VỚI EMAIL</span>
                </div>

                <form action="login.html">
                    <div class="input-group">
                        <label>Họ và Tên</label>
                        <div class="input-box">
                            <i class="ri-user-line"></i>
                            <input type="text" placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Email</label>
                        <div class="input-box">
                            <i class="ri-mail-line"></i>
                            <input type="email" placeholder="example@email.com" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Mật khẩu</label>
                        <div class="input-box">
                            <i class="ri-lock-line"></i>
                            <input type="password" placeholder="Tối thiểu 8 ký tự" required>
                            <i class="ri-eye-off-line eye-icon"></i>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label>
                            <input type="checkbox" required style="margin-top: 3px;"> 
                            <span>Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật</a> của LocalBrand.</span>
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">
                        Đăng Ký Ngay <i class="ri-user-add-line"></i>
                    </button>
                </form>

                <div class="login-link">
                    Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
